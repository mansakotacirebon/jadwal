<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="description"
      content="Dashboard Jadwal Pelajaran - Tampilkan jadwal berdasarkan Hari, Mapel, Guru, dan Kelas."
    />
    <title>Jadwal Pelajaran TA 2026/2027</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Jadwal" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <style>
      :root {
        --primary-color: #6366f1;
        --primary-hover: #4f46e5;
        --bg-dark: #0f172a;
        --bg-card: #1e293b;
        --text-main: #f8fafc;
        --text-main-top: #ffffff;
        --text-muted: #94a3b8;
        --border-color: #334155;
        --accent-color: #38bdf8;
        --success-color: #22c55e;
        --warning-color: #eab308;
        --danger-color: #ef4444;
      }

      /* Light Mode */
      [data-theme="light"] {
        --primary-color: #4f46e5;
        --primary-hover: #4338ca;
        --bg-dark: #f8f9fa;
        --bg-card: #ffffff;
        --text-main: #1e293b;
        --text-main-top: #000000;
        --text-muted: #0c131b;
        --border-color: #e2e8f0;
        --accent-color: #0ea5e9;
        --success-color: #16a34a;
        --warning-color: #ca8a04;
        --danger-color: #dc2626;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        text-decoration: none;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-main);
        height: 100vh;
        overflow: hidden;
        transition:
          background-color 0.3s,
          color 0.3s;
      }
      a {
        color: chartreuse;
      }
      .app-container {
        display: flex;
        height: 100%;
      }

      /* Sidebar */
      .sidebar {
        width: 280px;
        background-color: var(--bg-card);
        border-right: 1px solid var(--border-color);
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        overflow-y: auto;
      }

      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }

      .brand-logo {
        width: 80px;
        height: auto;
        object-fit: contain;
      }

      .brand h1 {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--accent-color);
        letter-spacing: -0.5px;
        text-align: center;
        line-height: 1.3;
      }

      .filters {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .filter-group label {
        display: block;
        font-size: 0.875rem;
        color: var(--text-muted);
        margin-bottom: 0.5rem;
        font-weight: 500;
      }

      .count-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: var(--primary-color);
        color: white;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.15rem 0.5rem;
        border-radius: 9999px;
        margin-left: 0.5rem;
        min-width: 1.5rem;
      }

      .select-wrapper {
        position: relative;
      }

      select {
        width: 100%;
        padding: 0.75rem;
        background-color: var(--bg-dark);
        border: 1px solid var(--border-color);
        border-radius: 0.5rem;
        color: var(--text-main);
        font-family: inherit;
        font-size: 0.9rem;
        appearance: none;
        cursor: pointer;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      select:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
      }

      .btn-reset {
        width: 100%;
        padding: 0.75rem;
        background-color: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        border-radius: 0.5rem;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s;
      }

      .btn-reset:hover {
        background-color: var(--bg-dark);
        color: var(--text-main);
        border-color: var(--text-muted);
      }

      .preset-section {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding-top: 0.25rem;
      }

      .preset-section h3 {
        font-size: 0.9rem;
        color: var(--text-main);
      }

      .preset-description,
      .preset-status {
        color: var(--text-muted);
        font-size: 0.75rem;
        line-height: 1.4;
      }

      .preset-actions {
        display: flex;
        gap: 0.5rem;
      }

      .preset-actions button {
        flex: 1;
        padding: 0.6rem 0.35rem;
        border: 1px solid var(--border-color);
        border-radius: 0.5rem;
        background: transparent;
        color: var(--text-main);
        cursor: pointer;
        font: inherit;
        font-size: 0.75rem;
      }

      .preset-actions button:hover {
        border-color: var(--primary-color);
        color: var(--primary-color);
      }

      .preset-actions #delete-preset:hover {
        border-color: var(--danger-color);
        color: var(--danger-color);
      }

      .stats-card {
        margin-top: none;
        background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--primary-hover)
        );
        padding: 1rem;
        border-radius: 0.75rem;
        color: white;
        text-align: center;
      }

      .stats-card h3 {
        font-size: 0.875rem;
        opacity: 0.9;
        margin-bottom: 0.25rem;
      }

      .stats-card p {
        font-size: 1.5rem;
        font-weight: 700;
      }

      /* Main Content */
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .top-bar {
        padding: 1rem 1rem;
        background-color: var(--bg-dark);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        transition:
          background-color 0.3s,
          border-color 0.3s;
      }

      .top-bar h2 {
        font-size: 1.25rem;
        font-weight: 600;
      }

      .theme-toggle {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .btn-toggle-theme {
        background: none;
        border: 1px solid var(--border-color);
        color: var(--text-main);
        font-size: 1.2rem;
        cursor: pointer;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn-toggle-theme:hover {
        background-color: var(--bg-card);
        border-color: var(--primary-color);
        color: var(--primary-color);
      }

      .search-bar input {
        width: 300px;
        padding: 0.6rem 1rem;
        border-radius: 2rem;
        border: 1px solid var(--border-color);
        background-color: var(--bg-card);
        color: var(--text-main);
        font-family: inherit;
        transition: width 0.3s ease;
      }

      .search-bar input:focus {
        width: 350px;
        outline: none;
        border-color: var(--primary-color);
      }

      .grid-container {
        flex: 1;
        min-height: 0;
        /* fill remaining height after header + badges bar */
        padding: 1rem;
        overflow-y: auto;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 0.5rem;
        display: grid;
      }

      /* Menambahkan ruang khusus di paling bawah grid */
      .grid-container::after {
        content: "";
        display: block;
        grid-column: 1 / -1;
        /* Memaksa elemen ini membentang dari kolom pertama sampai akhir */
        height: 100vh;
        /* Atur besarnya jarak bawah yang Anda inginkan di sini */
      }

      /* Schedule Card */
      /* Animation Removed to prevent layout lock */
      .card {
        background-color: var(--bg-card);
        border-radius: 1rem;
        padding: 0.5rem 1.5rem;
        border: 1px solid var(--border-color);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        position: relative;
        overflow: visible !important;
        display: flex !important;
        flex-direction: column !important;
        height: 100px;
        min-height: 6rem;
        /* Force minimum height to prevent collapse */
      }

      /* ... keep hover ... */

      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        border-color: var(--primary-color);
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background-color: var(--accent-color);
      }

      /* Warna card berdasarkan jam */
      .card-jam-01 {
        --jam-color: #ff6b6b;
      }
      .card-jam-02 {
        --jam-color: #ff922b;
      }
      .card-jam-03 {
        --jam-color: #ffd93d;
      }
      .card-jam-04 {
        --jam-color: #6bcb77;
      }
      .card-jam-05 {
        --jam-color: #4d96ff;
      }
      .card-jam-06 {
        --jam-color: #9d4edd;
      }
      .card-jam-07 {
        --jam-color: #ff006e;
      }
      .card-jam-08 {
        --jam-color: #fb5607;
      }
      .card-jam-09 {
        --jam-color: #00b4d8;
      }
      .card-jam-10 {
        --jam-color: #06ffa5;
      }
      .card-jam-11 {
        --jam-color: #ff10f0;
      }

      .card-jam-01 {
        background-color: rgba(255, 107, 107, 0.08);
        border-left-color: #ff6b6b;
      }
      .card-jam-02 {
        background-color: rgba(255, 146, 43, 0.08);
        border-left-color: #ff922b;
      }
      .card-jam-03 {
        background-color: rgba(255, 217, 61, 0.08);
        border-left-color: #ffd93d;
      }
      .card-jam-04 {
        background-color: rgba(107, 203, 119, 0.08);
        border-left-color: #6bcb77;
      }
      .card-jam-05 {
        background-color: rgba(77, 150, 255, 0.08);
        border-left-color: #4d96ff;
      }
      .card-jam-06 {
        background-color: rgba(157, 78, 221, 0.08);
        border-left-color: #9d4edd;
      }
      .card-jam-07 {
        background-color: rgba(255, 0, 110, 0.08);
        border-left-color: #ff006e;
      }
      .card-jam-08 {
        background-color: rgba(251, 86, 7, 0.08);
        border-left-color: #fb5607;
      }
      .card-jam-09 {
        background-color: rgba(0, 180, 216, 0.08);
        border-left-color: #00b4d8;
      }
      .card-jam-10 {
        background-color: rgba(6, 255, 165, 0.08);
        border-left-color: #06ffa5;
      }
      .card-jam-11 {
        background-color: rgba(255, 16, 240, 0.08);
        border-left-color: #ff10f0;
      }

      .card-jam-01::before {
        background-color: #ff6b6b;
      }
      .card-jam-02::before {
        background-color: #ff922b;
      }
      .card-jam-03::before {
        background-color: #ffd93d;
      }
      .card-jam-04::before {
        background-color: #6bcb77;
      }
      .card-jam-05::before {
        background-color: #4d96ff;
      }
      .card-jam-06::before {
        background-color: #9d4edd;
      }
      .card-jam-07::before {
        background-color: #ff006e;
      }
      .card-jam-08::before {
        background-color: #fb5607;
      }
      .card-jam-09::before {
        background-color: #00b4d8;
      }
      .card-jam-10::before {
        background-color: #06ffa5;
      }
      .card-jam-11::before {
        background-color: #ff10f0;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 1rem;
        gap: 1rem;
        flex-shrink: 0;
        /* Prevent header from squishing */
      }

      .card-mapel {
        font-size: 1.125rem;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 0.25rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .card-guru {
        font-size: 0.875rem;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tag {
        padding: 0.25rem 0.25rem;
        border-radius: 1rem;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        flex-shrink: 0;
        /* Ensure tag doesn't squish */
      }

      .tag-kelas {
        background-color: rgba(56, 189, 248, 0.1);
        color: var(--accent-color);
        font-size: 1rem;
        padding: 0.5rem 0.5rem;
        border: 1px solid rgba(56, 189, 248, 0.2);
      }

      .card-body {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        flex-grow: 1;
        /* Fill remaining space */
      }

      .info-row {
        display: flex;
        align-items: center;
        gap: 0.1rem;
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      .info-val {
        color: var(--text-main);
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .card-footer {
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        justify-content: flex-end;
      }

      /* Animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .hidden {
        display: none !important;
      }

      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-muted);
      }

      .empty-state img {
        width: 200px;
        margin-bottom: 1rem;
        opacity: 0.8;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .app-container {
          flex-direction: column;
          position: relative;
        }

        .sidebar {
          position: fixed;
          left: 0;
          top: 0;
          width: 280px;
          height: 100vh;
          background-color: var(--bg-card);
          border-right: 1px solid var(--border-color);
          padding: 1.5rem;
          display: flex;
          flex-direction: column;
          gap: 1.5rem;
          overflow-y: auto;
          z-index: 1000;
          transform: translateX(-100%);
          transition: transform 0.3s ease;
        }

        .sidebar.active {
          transform: translateX(0);
        }

        .sidebar::after {
          content: "";
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background-color: rgba(0, 0, 0, 0.5);
          z-index: -1;
          transition: opacity 0.3s ease;
          opacity: 0;
          pointer-events: none;
        }

        .sidebar.active::after {
          opacity: 1;
          pointer-events: auto;
        }

        .filters {
          flex-direction: column;
          flex: 1;
          overflow-x: auto;
          gap: 1rem;
        }

        .filter-group {
          min-width: 140px;
        }

        .top-bar {
          padding: 0.3rem;
          display: flex;
          gap: 1rem;
          align-items: center;
        }

        .btn-toggle-sidebar {
          background: none;
          border: 1px solid var(--border-color);
          color: var(--text-main);
          font-size: 1.5rem;
          cursor: pointer;
          padding: 0.5rem 0.75rem;
          border-radius: 0.5rem;
          transition: all 0.2s;
          flex-shrink: 0;
        }

        .btn-toggle-sidebar:hover {
          background-color: var(--bg-card);
          border-color: var(--primary-color);
          color: var(--primary-color);
        }

        .top-bar h2 {
          flex: 1;
          font-size: 1.25rem;
          white-space: nowrap;
          color: var(--text-main-top);
        }

        .search-bar input {
          width: 100%;
          max-width: 250px;
        }
      }

      /* === Active Filter Badges === */
      .filter-badges-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1rem;
        background-color: var(--bg-dark);
        border-bottom: 1px solid var(--border-color);
        transition:
          background-color 0.3s,
          border-color 0.3s;
        min-height: 0;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition:
          max-height 0.25s ease,
          opacity 0.25s ease,
          padding 0.25s ease;
        padding-top: 0;
        padding-bottom: 0;
        flex-shrink: 0;
      }

      .filter-badges-bar.has-badges {
        max-height: 80px;
        opacity: 1;
        padding-top: 0.6rem;
        padding-bottom: 0.6rem;
      }

      .filter-badge-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 500;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .filter-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.12),
          rgba(56, 189, 248, 0.08)
        );
        border: 1px solid rgba(99, 102, 241, 0.35);
        color: var(--text-main);
        padding: 0.3rem 0.65rem;
        border-radius: 9999px;
        font-size: 0.78rem;
        font-weight: 500;
        cursor: default;
        transition:
          border-color 0.2s,
          background 0.2s;
        animation: badgePop 0.18s ease;
      }

      @keyframes badgePop {
        from {
          transform: scale(0.75);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .filter-badge:hover {
        border-color: var(--danger-color);
        background: rgba(239, 68, 68, 0.08);
      }

      .badge-key {
        color: var(--text-muted);
        font-size: 0.72rem;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.03em;
      }

      .badge-val {
        font-weight: 600;
        max-width: 160px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .badge-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        font-size: 0.8rem;
        line-height: 1;
        cursor: pointer;
        color: var(--text-muted);
        transition:
          background 0.15s,
          color 0.15s;
        flex-shrink: 0;
      }

      .badge-close:hover {
        background: var(--danger-color);
        color: #fff;
      }
    </style>
  </head>

  <body>
    <div class="app-container">
      <!-- Sidebar / Filter Panel -->
      <aside class="sidebar">
        <div class="brand">
          <img
            src="logo.svg"
            alt="Logo MAN 1 Kota Cirebon"
            class="brand-logo"
          />
          <h1>MAN 1 Kota Cirebon</h1>
        </div>


        <div class="filters">
          <section class="preset-section" aria-labelledby="preset-heading">
            <h3 id="preset-heading">Preset default</h3>
            <p class="preset-description">
              ⚡Simpan filter untuk akses cepat⚡
            </p>
            <div class="preset-actions">
              <button id="save-preset" type="button">Simpan preset</button>
              <button id="delete-preset" type="button" hidden>
                Hapus preset
              </button>
            </div>
            <p id="preset-status" class="preset-status" role="status">
              Belum ada preset.
            </p>
          </section>
          <div class="filter-group">
            <label for="filter-hari"
              >Hari <span class="count-badge" id="count-hari">0</span></label
            >
            <div class="select-wrapper">
              <select id="filter-hari">
                <option value="">Jumlah Hari</option>
                <!-- Options populated via JS -->
              </select>
            </div>
          </div>

          <div class="filter-group">
            <label for="filter-kelas"
              >Kelas <span class="count-badge" id="count-kelas">0</span></label
            >
            <div class="select-wrapper">
              <select id="filter-kelas">
                <option value="">Jumlah Kelas</option>
              </select>
            </div>
          </div>

          <div class="filter-group">
            <label for="filter-mapel"
              >Mata Pelajaran
              <span class="count-badge" id="count-mapel">0</span></label
            >
            <div class="select-wrapper">
              <select id="filter-mapel">
                <option value="">Jumlah Mapel</option>
              </select>
            </div>
          </div>

          <div class="filter-group">
            <label for="filter-guru"
              >Guru <span class="count-badge" id="count-guru">0</span></label
            >
            <div class="select-wrapper">
              <select id="filter-guru">
                <option value="">Jumlah Guru</option>
              </select>
            </div>
          </div>

          <button id="reset-filters" class="btn-reset">Reset Filter</button>
        </div>
                <div class="stats-card">
          <h3>Total Jadwal</h3>
          <p id="total-count">0</p>
        </div>
      </aside>

      <!-- Main Content -->
